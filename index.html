<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Análisis Inventario Obras v2</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SheetJS para Excel -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Hojas de Estilos Modulares -->
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/tabs.css">
    <link rel="stylesheet" href="css/modals.css">
    <link rel="stylesheet" href="css/stepper.css">
    <link rel="stylesheet" href="css/tables.css">
    <!-- Interceptor DOMContentLoaded de Antigravity Loader -->
    <script>
        window._pendingDCL = [];
        window._origAEL = EventTarget.prototype.addEventListener;
        EventTarget.prototype.addEventListener = function (type, handler, options) {
            if (this === document && type === 'DOMContentLoaded') {
                window._pendingDCL.push({ handler, options });
                return;
            }
            window._origAEL.call(this, type, handler, options);
        };
    </script>
</head>

<body class="bg-slate-100 text-slate-800 font-sans antialiased h-screen flex flex-col overflow-hidden">

    <!-- NAVBAR Y STEPPER UNIFICADO (COMPACTO) -->
    <header
        class="bg-white border-b border-slate-300 shadow-sm h-12 flex items-center justify-between px-4 shrink-0 z-20 gap-4">
        <!-- MARCA / LOGO -->
        <div class="flex items-center gap-2 text-slate-800 shrink-0 select-none">
            <div class="w-7 h-7 rounded-lg bg-indigo-600 text-white flex items-center justify-center shadow-xs">
                <i class="fa-solid fa-chart-pie text-xs"></i>
            </div>
            <span class="text-xs font-bold tracking-tight text-slate-800 hidden md:inline">Auditoría de Obras</span>
        </div>

        <!-- STEPPER DE ETAPAS INTERACTIVO INTEGRADO -->
        <div class="flex items-center justify-center gap-0 select-none">
            <div class="stepper-step flex items-center gap-1.5 cursor-pointer hover:opacity-80 transition-opacity"
                onclick="navigateToStep(0)">
                <div class="stepper-dot" id="stepDot0">1</div>
                <span class="stepper-label text-[11px] sm:text-xs" id="stepLabel0">Etapa 1 · BCMO</span>
            </div>
            <div class="stepper-line" id="stepLine0"></div>
            <div class="stepper-step flex items-center gap-1.5 cursor-pointer hover:opacity-80 transition-opacity"
                onclick="navigateToStep(1)">
                <div class="stepper-dot" id="stepDot1">2</div>
                <span class="stepper-label text-[11px] sm:text-xs" id="stepLabel1">Etapa 2 · Consolidación</span>
            </div>
            <div class="stepper-line" id="stepLine1"></div>
            <div class="stepper-step flex items-center gap-1.5 cursor-pointer hover:opacity-80 transition-opacity"
                id="stepperStepEtapa3"
                onclick="navigateToStep(2)">
                <div class="stepper-dot" id="stepDot2">3</div>
                <span class="stepper-label text-[11px] sm:text-xs" id="stepLabel2">Etapa 3 · TAREA</span>
            </div>
            <div class="stepper-line" id="stepLine2"></div>
            <div class="stepper-step flex items-center gap-1.5 cursor-pointer hover:opacity-80 transition-opacity"
                onclick="navigateToStep(3)">
                <div class="stepper-dot" id="stepDot3">4</div>
                <span class="stepper-label text-[11px] sm:text-xs" id="stepLabel3">Resultados</span>
            </div>
        </div>

        <!-- CONTROLES DE USUARIO Y FECHA VISIBLES -->
        <div class="flex items-center gap-2 shrink-0">
            <div class="flex items-center gap-1.5 bg-indigo-50 border border-indigo-200 px-2.5 py-1 rounded-md shadow-2xs"
                title="Datos obligatorios para procesar la auditoría">
                <i class="fa-solid fa-user-tie text-indigo-700 text-xs"></i>
                <input type="text" id="auditorName" oninput="checkReadyToConsolidate()"
                    placeholder="Analista / Auditor *"
                    class="w-32 sm:w-36 p-0 border-none focus:ring-0 outline-none text-xs font-bold bg-transparent text-indigo-900 placeholder-indigo-400">

                <div class="w-px h-4 bg-indigo-300 mx-0.5"></div>

                <i class="fa-solid fa-calendar-day text-indigo-700 text-xs"></i>
                <input type="date" id="globalAuditDate" onchange="checkReadyToConsolidate()"
                    class="w-28 p-0 border-none focus:ring-0 outline-none text-xs font-bold bg-transparent text-indigo-900 cursor-pointer">
            </div>

            <button type="button" id="btnExportar" onclick="exportToExcel()"
                class="hidden items-center gap-1.5 bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-1 rounded text-xs font-semibold transition-colors shadow-2xs">
                <i class="fa-solid fa-file-excel"></i> Exportar Maestro
            </button>
        </div>
    </header>

    <!-- OVERLAY DE CARGA / PROCESAMIENTO -->
    <div id="globalLoadingOverlay">
        <div class="loading-spinner"></div>
        <p class="text-sm font-semibold text-slate-600" id="globalLoadingText">Procesando...</p>
    </div>

    <!-- PANEL DE CONFIGURACIÓN (Oculto por defecto) -->
    <div id="configPanel"
        class="hidden bg-white border-b border-slate-300 px-6 py-4 shadow-inner shrink-0 text-sm flex-col gap-4 z-10">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="flex flex-col gap-3">
                <div class="flex items-center gap-4">
                    <label class="font-bold text-slate-700 w-32">Fórmula Obra BF:</label>
                    <input type="text" id="formulaInput" value='LEFT(SUBSTITUTE([Nodo], " ", ""), 7)'
                        class="flex-1 p-1.5 border border-slate-300 rounded focus:ring-1 focus:ring-indigo-500 outline-none formula-input text-xs text-indigo-700 bg-slate-50">
                </div>
                <div class="flex flex-col gap-1">
                    <label class="font-bold text-slate-700">Contratistas a ignorar (Corporativo):</label>
                    <textarea id="configExcludedContratistas" rows="2"
                        class="w-full p-2 border border-slate-300 rounded focus:ring-1 focus:ring-indigo-500 outline-none text-xs bg-slate-50">Suspendida, Sin obra, En hold, Cancelada, Obra suspendida, Sin obra EXT, PP, Compras, P. Propio, Obras, Tercero</textarea>
                    <p class="text-[10px] text-slate-400">Separadas por comas. Estas opciones serán omitidas
                        automáticamente en el selector del archivo Corporativo.</p>
                </div>
            </div>

            <div class="flex flex-col gap-3">
                <div class="flex flex-col gap-1 mt-auto">
                    <label class="font-bold text-slate-700">Restauración y Sesión:</label>
                    <div class="flex items-center gap-2">
                        <button type="button" onclick="exportFullSessionJSON()"
                            class="bg-indigo-50 text-indigo-700 border border-indigo-200 hover:bg-indigo-100 px-3 py-1.5 rounded text-xs font-bold transition-colors flex items-center gap-2">
                            <i class="fa-solid fa-download"></i> Guardar Sesión
                        </button>
                        <button type="button" onclick="document.getElementById('jsonFileInput').click()"
                            class="bg-white border border-slate-300 hover:bg-slate-50 text-slate-700 px-3 py-1.5 rounded text-xs font-bold transition-colors flex items-center gap-2">
                            <i class="fa-solid fa-upload"></i> Restaurar Sesión
                        </button>
                        <input type="file" id="jsonFileInput" accept=".json" class="hidden"
                            onchange="importFullSessionJSON(event)">
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- ÁREA PRINCIPAL -->

    <main class="flex-1 flex flex-col min-h-0 relative" id="mainContainer">

        <!-- ESTADO INICIAL: Panel de Carga -->
        <div id="setupSection"
            class="p-6 shrink-0 border-b border-slate-200 bg-slate-50 z-10 flex-1 flex flex-col overflow-y-auto">
            <div class="max-w-5xl mx-auto w-full flex flex-col gap-6 mt-4 mb-10">

                <!-- === ETAPA 1 (tarjeta): Cargada dinamicamente === -->
                <div id="etapa1-card-container"></div>

                <!-- === ETAPA 2 (tarjeta): Cargada dinamicamente === -->
                <div id="etapa2-card-container"></div>

                <!-- === ETAPA 3 (tarjeta): Cargada dinamicamente === -->
                <div id="etapa3-card-container"></div>

            </div>
        </div>

        <!-- resultsSection, modales y s1_bcmoModule se inyectan aqui por el loader -->
        <div id="etapa2-results-container"></div>
        <div id="etapa1-bcmo-container"></div>
        <div id="etapa3-tarea-container"></div>

    </main>

    <!-- CONTENEDOR DE NOTIFICACIONES TOAST -->
    <div id="toastContainer" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <!-- ============================================================ -->
    <!-- MÓDULOS DE ANÁLISIS Y LÓGICA DE NEGOCIO                      -->
    <!-- ============================================================ -->
    <script src="modules/procesadorTarea.js"></script>
    <script src="modules/detallePM.js"></script>
    <script src="modules/bcmoSinCruce.js"></script>
    <script src="modules/caducidad.js"></script>
    <script src="modules/analisisObras.js"></script>
    <script src="modules/orphans.js"></script>
    <script src="modules/auditoria.js"></script>
    <script src="modules/recategorizacion.js"></script>
    <script src="modules/consolidacion.js"></script>
    <script src="modules/detalleTarea.js"></script>
    <script src="modules/etapa2Logic.js"></script>
    <script src="modules/etapa1Logic.js"></script>
    <!-- SISTEMAS INDEPENDIENTES MODALIDAD TAREA (archivos_tarea) -->
    <script src="modules/tarea_paso1_ticketsBF.js"></script>
    <script src="modules/tarea_paso2_avanceObras.js"></script>
    <script src="modules/tarea_paso3_matrizConsistencia.js"></script>
    <script src="modules/tarea_paso4_materialesSaldos.js"></script>
    <script src="modules/etapa3Logic.js"></script>
    <script src="modules/batchLoader.js"></script>

    <!-- ============================================================ -->
    <!-- COMPONENTES HTML DINÁMICOS Y CARGADOR                         -->
    <!-- ============================================================ -->
    <script src="components/etapa1BCMO.js"></script>
    <script src="components/etapa2Consolidacion.js"></script>
    <script src="components/etapa3Tarea.js"></script>
    <script src="modules/componentLoader.js"></script>
</body>

</html>
